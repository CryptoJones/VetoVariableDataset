# Derivation experiment — bare lanes, no personas, one per lineage.
budget_usd: 5.0
retries: 1
deadline_seconds: 1800
defaults:
  max_tokens: 12000
lanes:
  - name: OpenAI-Luna
    harness: http
    vendor: d-openai
    model: openai/gpt-5.6-luna
    base_url: https://openrouter.ai/api/v1
    key_entry: <your-pass-entry-for-an-openrouter-key>
    timeout: 300
  - name: Google-G37F
    harness: http
    vendor: d-google
    model: google/gemini-3.7-flash
    base_url: https://openrouter.ai/api/v1
    key_entry: <your-pass-entry-for-an-openrouter-key>
    timeout: 300
  - name: DeepSeek-V4P
    harness: http
    vendor: d-deepseek
    model: deepseek/deepseek-v4-pro
    base_url: https://openrouter.ai/api/v1
    key_entry: <your-pass-entry-for-an-openrouter-key>
    timeout: 300
  - name: Qwen-24T
    harness: http
    vendor: d-qwen
    model: qwen/qwen3.8-2.4t-a95b
    base_url: https://openrouter.ai/api/v1
    key_entry: <your-pass-entry-for-an-openrouter-key>
